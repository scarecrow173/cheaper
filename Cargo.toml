# Repo-root virtual manifest for the Rust migration (Phase 1+).
[workspace]
resolver = "2"
members = ["crates/*"]

[workspace.package]
edition = "2021"
# Product binary version — the canonical source (Phase 6 flip; previously
# packages/cli/package.json). scripts/check-version.mjs enforces that
# packages/apm/apm.yml matches this declaration. Only cheaper-cli — the
# shipped `cheaper` binary — inherits it via `version.workspace = true`. The
# library crates keep their own "0.1.0" because they are internal path
# dependencies that are never published or released independently.
version = "1.0.0"

# Shared dependency pins. Cargo semver caveat (plan Risk #1): exact pins use
# `=x.y.z`; `rig`-family crates use the `=0.43.x` pin policy from the parent
# plan and are never a dependency of `cheaper-core`.
[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
# `preserve_order`: ISS-19(d) — JSON object key order (insertion order) is
# contractual for snapshot pattern search order and savings fields.
# `raw_value`: required by the JS-compatible canonical number formatter
# (json/number.rs) to emit raw numeric text inside serde_json output.
serde_json = { version = "1", features = ["preserve_order", "raw_value"] }
# YAML 1.2 frontmatter / policy.yaml / models.yaml parsing. serde_yml 0.0.13
# is a deprecation shim over noyalib that implements YAML 1.2 strict booleans
# (the "Norway problem" fix); serde_norway resolves y/n/on/off as bools and
# would diverge from the eemeli `yaml` parser the TS side uses.
serde_yml = "=0.0.13"
# JSON Schema draft 2020-12 validation (Ajv 2020 replacement). Default
# features (http/file $ref resolution via reqwest) are disabled: cheaper
# schemas are self-contained and must not trigger network access.
jsonschema = { version = "0.58", default-features = false }
# o200k_base BPE token counting (js-tiktoken replacement).
tiktoken-rs = "0.12"
# Windows `\\?\` verbatim-prefix stripping after canonicalize.
dunce = "1"
# Deny-pattern regexes, worker name pattern, env-var name pattern, etc.
regex = "1"
# Rig facade for `cheaper-rig-adapter` (Phase 3 T1) and later provider crates.
# Pin policy: `=0.43.x` (plan Risk #1); 0.43.0 is the PoC-validated line.
rig = "=0.43.0"
# Stream combinators for the adapter's run surface.
futures = "0.3"
# cheaper-tools (Phase 2). Async runtime boundary for the tool layer:
# process spawn/capture, scheduler timers, CancellationToken via
# tokio-util. Features stay at the plan-approved minimal set.
tokio = { version = "1", features = [
    "rt",
    "process",
    "fs",
    "time",
    "sync",
    "io-util",
    "macros",
] }
tokio-util = "0.7"
# grep eval engine: EcmaScript-syntax regular expressions (JS `RegExp`
# dialect is part of the tool contract; plan fixed rule).
regress = "0.12"
# NFKC normalization for edit fuzzy matching.
unicode-normalization = "0.1"
# Line diff for MutationJournal / edit diff (jsdiff `diffLines`
# replacement; differential fixtures decide whether a direct port is
# needed).
similar = "3"
# Glob matcher for find/grep (`path.posix.matchesGlob` parity is verified
# against fixtures).
# Lightweight RNG for temp file names.
fastrand = "2"
# POSIX process control (kill(-pid), setrlimit) — unix-only target dep.
libc = "0.2"

[profile.release]
lto = true
opt-level = "s"
strip = true
codegen-units = 1
# panic = "abort" is forbidden: run/command boundaries rely on catch_unwind.
panic = "unwind"
