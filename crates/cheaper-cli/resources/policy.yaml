version: 1
# `process.tasks`・`command.grants` は resolve 時に単一 `exec` grant
# namespace へ畳まれる(issue #165 — task は `fixed:true` grant、
# command grant は `!fixed` grant。両 section の名衝突は
# InvalidRuntimePolicy + details.{grant,task} で fail closed)。
process:
  maxConcurrent: 1
  timeout: 2m
  maxOutputBytes: 65536
  killGrace: 2s
  heartbeat:
    interval: 30s
  tasks: {}

command:
  maxConcurrent: 1
  timeout: 2m
  maxOutputBytes: 65536
  killGrace: 2s
  heartbeat:
    interval: 30s
  grants: {}

execution:
  # run 経路では進捗 RunEvent の観測でリセットされる stall window
  # (workflow 経路の timeout は従来どおり全体の absolute deadline)。
  timeout: 300s
  # null = policy レベルの turn 上限なし(内部 runaway guard のみ)。
  # 明示整数にすると従来どおり MAX_TURNS_EXCEEDED の policy abort 境界。
  maxTurns: null
  maxToolCalls: 64

tools:
  allow:
    - read
    - grep
    - find
    - ls
    - write
    - edit
    - count_tokens
    - process
    - command

filesystem:
  symlinks: within-workspace
  # built-in credential pattern（core DEFAULT_DENY_PATHS）に追加する deny pattern
  denyPaths: []

model:
  maxTier: medium
  tierFallback: none

output:
  maxTokens: 2000
  repairAttempts: 1

retry:
  transientAttempts: 1

route:
  rewrite:
    # permissionDecision:"allow" 併記の rewrite emit(親 agent の approval
    # prompt を素通しする応答)を許可する hook target 名
    # (codex/cursor/copilot)。trusted layer のみ authoring 可能。
    approvalBypass: []

security:
  # 全 exec grant（`command.grants` + `process.tasks` 由来の fixed
  # grant）の executable への opt-in deterministic executable
  # deny-list（executable 名の regex、basename stem への anchored
  # case-insensitive 完全一致）。既定 [] = deny 無し。trusted layer
  # のみ authoring 可能（project policy は拒否）。containment 機構
  # ではなく known-bad executable への fail-fast — 詳細は
  # docs/guides/command.md を参照。
  execDenyPatterns: []
