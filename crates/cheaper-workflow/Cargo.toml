[package]
name = "cheaper-workflow"
version = "0.1.0"
edition.workspace = true
publish = false
description = "Port of packages/workflow: workflow definition schema, compiler, DAG engine, resource inference, artifact store, loader. Rig-free; tokio for the engine scheduler."

[dependencies]
cheaper-core = { path = "../cheaper-core" }
cheaper-tools = { path = "../cheaper-tools" }
serde.workspace = true
serde_json.workspace = true
tokio.workspace = true
tokio-util.workspace = true
tracing.workspace = true
# `randomUUID()`(runId / artifact id)。version pin は workspace 側。
uuid.workspace = true

[dev-dependencies]
tempfile.workspace = true
# engine test は paused clock で abortGrace/timeout の deterministic 再現を
# 行う(vi.useFakeTimers 相当)。
tokio = { workspace = true, features = ["test-util"] }
