[package]
name = "poc-rig"
version = "0.1.0"
edition = "2024"
publish = false

[dependencies]
rig = { version = "=0.43.0", features = ["test-utils"] }
tokio = { version = "1", features = ["macros", "rt-multi-thread", "sync", "fs"] }
futures = "0.3"
http = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
jsonschema = "0.58"
anyhow = "1"
thiserror = "2"
async-trait = "0.1"

[profile.release]
lto = true
opt-level = "s"
strip = true
codegen-units = 1
panic = "unwind"
