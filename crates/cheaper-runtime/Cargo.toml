[package]
name = "cheaper-runtime"
version = "0.1.0"
edition.workspace = true
publish = false
description = "Port of packages/runtime-pi: model catalog store (G1), credential store + auth service (G2), provider plugin contract. run orchestration lands in T3. No Rig types (adapter trait boundary)."

[dependencies]
cheaper-core = { path = "../cheaper-core" }
cheaper-tools = { path = "../cheaper-tools" }
cheaper-rig-adapter = { path = "../cheaper-rig-adapter" }
serde.workspace = true
serde_json.workspace = true
# models.json user file: TypeBox `ModelsConfigSchema` 相当の validation。
# core と同じ jsonschema 系を使う(draft 2020-12・ref 解決 off)。
jsonschema.workspace = true
# T3(run orchestration: abort grace・spawn 境界)で使用。T2 surface 自体は sync。
tokio.workspace = true
# RunStream 駆動(`StreamExt::next`)と panic 境界(`FutureExt::catch_unwind`)。
futures.workspace = true
# Observability foundation(T3): run pipeline stage span/emit。
# subscriber/sink 配線は cheaper-observability(cli 経由)のみが持つ。
tracing.workspace = true
# T6 OAuth flow の HTTP transport。sync `OAuthFlow` contract に合わせ
# blocking client を採用（ureq 2.x は Cargo.lock に既出 — rig/hf-hub の
# transitive dep と同 version を再利用）。
ureq = "2"
# T6 OAuth の URL parse/正規化（enterprise domain・verification_uri の
# `new URL` 相当 + form-urlencoded body 生成。lock 済みの url 2.x）。
url = "2"
# OpenAI Codex OAuth: PKCE S256 challenge。
sha2 = "0.10"
# OpenAI Codex OAuth: verifier/state の CSPRNG（0.2/0.4 と API が異なる
# ため 0.3 系を pin — `getrandom::fill`）。
getrandom = "0.3"
# OpenAI Codex OAuth: PKCE verifier/challenge の base64url encode
# （workspace pin の 0.22 系）。
base64.workspace = true

[dev-dependencies]
tempfile.workspace = true

# dev/test seam(`dev::{fixture,fake_provider}`)の compile-time gate。
# default off — consumer install は seam を含まない binary を得る
# (ADR-034DyGyITd0YaATg8fkld7)。
[features]
dev-seam = []

# fixture DSL に全面依存する seam-only target。seam/non-seam 混在だった
# `tests/run.rs` の seam case は `tests/run_dev_seam.rs` へ分離済み
# (non-seam case は `tests/run.rs` に残り feature 無しでも実行される)。
[[test]]
name = "run_fixture_test"
required-features = ["dev-seam"]

[[test]]
name = "run_dev_seam"
required-features = ["dev-seam"]
