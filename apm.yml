name: cheaper-dev
version: 1.0.0
description: Development APM project for cheaper (dev tooling and doc-driven workflow dependencies)
author: scarecrow173
targets:
- copilot
- codex
- claude
- cursor
- windsurf
- agent-skills
dependencies:
  apm:
  - scarecrow173/apm-packages/packages/basic-dev-foundation#main
  - scarecrow173/apm-packages/packages/recommended-dev-suite#main
  - scarecrow173/apm-packages/packages/steer-enterprise-web-research#main
  - scarecrow173/apm-packages/packages/doc-driven-dev#main
  - scarecrow173/apm-packages/packages/review-protocol#main
devDependencies:
  mcp:
  - name: serena
    registry: false
    transport: stdio
    command: serena
    args:
    - start-mcp-server
    - --context
    - ide
    - --project-from-cwd
  - name: mise
    registry: false
    transport: stdio
    command: mise
    args:
    - mcp
scripts: {}
