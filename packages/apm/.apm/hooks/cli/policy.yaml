version: 1
process:
  maxConcurrent: 1
  tasks: {}

execution:
  timeout: 120s
  maxTurns: 8
  maxToolCalls: 64

tools:
  allow:
    - read
    - grep
    - find
    - ls
    - write
    - edit
    - count_tokens

filesystem:
  symlinks: within-workspace
  # built-in credential pattern（core DEFAULT_DENY_PATHS）に追加する deny pattern
  denyPaths: []

model:
  maxTier: medium
  tierFallback: none

output:
  maxTokens: 2000
  repairAttempts: 1

retry:
  transientAttempts: 1
