[settings]
minimum_release_age = "7d"
# mise.lock を維持し、install/use で locked version を優先させる
lockfile = true

[env]
UV_EXCLUDE_NEWER = "1 week"

[tools]
node = "26"
# aqua:biomejs/biome(npm 非経由)。biome.json の schema version に揃える
biome = "2.5.13"
# rig が rust-version 1.95 を要求するため >=1.95 の固定 version を pin する。
# rustup default profile は環境依存なので fmt/clippy の component を明示する
# (fresh CI runner で `cargo fmt`/`cargo clippy` が component 欠落しないように)。
rust = { version = "1.99.0", components = "rustfmt,clippy" }
python = "3.12"
uv = "0.11"
# apm.lock.yaml は apm 0.28.0 で生成。0.30.0 は Windows で path dep 解決が
# 壊れているため lock 生成版に pin する。
"pipx:apm-cli"  = { version = "0.28.0", uvx_args = "--prerelease allow" }
"pipx:serena-agent" = "1.7.0"

# Repository-owned setup contract: fresh checkout を開発可能にする
# canonical entrypoint。toolchain は mise.toml + mise.lock で復元される。
[tasks.setup]
description = "Restore APM dependencies and Rust build outputs for a fresh checkout"
run = [
  "apm install",
  "cargo fetch",
  "cargo build --workspace --all-targets",
]

# Canonical verification contract: CI と同等の検証。
# セットアップ済み checkout を対象とし、setup には依存しない。
# benchmarks/test は benchmark harness 自体の node:test であり runtime
# 依存を持たないため check に配線する(benchmark 実測 run.mjs は手動のまま)。
[tasks.check]
description = "Verify the checkout: lint, fmt, clippy, test, lockfile and slim payload checks"
run = [
  "biome check",
  "cargo fmt --all -- --check",
  "cargo clippy --workspace --all-targets -- -D warnings",
  "node scripts/check-version.mjs",
  "node scripts/check-doc-ids.mjs",
  "cargo test --workspace",
  "node --test scripts/test/",
  "node --test benchmarks/test/",
  "node scripts/check-lockfile.mjs",
  "node scripts/check-apm-payload.mjs",
]
