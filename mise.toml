[settings]
minimum_release_age = "7d"
# mise.lock と整合する固定バージョンを通常の install/use でも利用する
lockfile = true

[env]
UV_EXCLUDE_NEWER = "1 week"

[tools]
node = "26"
# aqua:biomejs/biome(npm 非経由)。biome.jsonc の schema version に揃える
biome = "2.5.13"
# rig が rust-version 1.95 を要求するため >=1.95 の固定 version を pin する。
# rustup default profile は環境依存なので fmt/clippy の component を明示する
# (fresh CI runner で `cargo fmt`/`cargo clippy` が component 欠落しないように)。
rust = { version = "1.99.0", components = "rustfmt,clippy" }
# python は toolchain に含めない — pipx: バックエンドは uv 経由で uv 管理の
# cpython に venv を作るため、mise python を参照しない。直接 python を呼ぶ
# 用途ができた場合のみ追加する。
# GHSA-hq85-5cpj-mr62 (eMudhra 中間CA) の修正版は >=0.13.4。
# 0.13 系の範囲指定では minimum_release_age=7d 下の再解決が未修正版に
# 戻り得るため、修正版を明示 pin する。
uv = "0.13.5"
# apm.lock.yaml は apm 0.33.0 で生成。0.30.0-0.31.0 は Windows で path dep 解決が
# 壊れていた(WinError 3/206)が 0.32.0 の staging path 短縮(upstream #2941)で修正済み。
# GitHub release バイナリを backend にし pipx/uv 経由を避ける(pipx 固有の
# 依存 sidecar を lockfile に持たないため)
"github:microsoft/apm"  = "0.33.0"
"pipx:serena-agent" = "1.7.0"
# pre-commit 互換 runner(aqua:j178/prek)。hook 定義は .pre-commit-config.yaml
prek = "0.5.5"
# LFS 既存履歴の参照用(HEAD には LFS 追跡 file 無し)。Git for Windows 同梱版
# への環境依存を避け toolchain で固定する
git-lfs = "3.8.0"

# Repository-owned setup contract: fresh checkout を開発可能にする
# canonical entrypoint。toolchain は mise.toml + mise.lock で復元される。
# build/test/clippy 系の cargo コマンドは `dev-seam` feature を有効化する
# (seam 依存 test target は required-features で gate されており、
# feature 無しでは build/lint/test の検証から抜け落ちる —
# ADR-034DyGyITd0YaATg8fkld7)。
[tasks.setup]
description = "Restore APM dependencies, Rust build outputs and git hooks for a fresh checkout"
run = [
  "apm install",
  "cargo fetch",
  "cargo build --workspace --all-targets --features cheaper-runtime/dev-seam,cheaper-cli/dev-seam",
  "prek install",
  # repo 内 .git/config に LFS filter を登録(履歴 checkout 用)。global
  # ~/.gitconfig は触らない。`git lfs install` ではなく `git-lfs` を
  # 直接呼ぶのは git.exe が exec dir の bundled lfs を優先するため
  "git-lfs install --local",
]

# Canonical verification contract: CI と同等の検証。
# セットアップ済み checkout を対象とし、setup には依存しない。
# benchmarks/test は benchmark harness 自体の node:test であり runtime
# 依存を持たないため check に配線する(benchmark 実測 run.mjs は手動のまま)。
[tasks.check]
description = "Verify the checkout: lint, fmt, clippy, test, lockfile and slim payload checks"
run = [
  "biome check",
  "cargo fmt --all -- --check",
  "cargo clippy --workspace --all-targets --features cheaper-runtime/dev-seam,cheaper-cli/dev-seam -- -D warnings",
  "node scripts/check-version.mjs",
  "node scripts/check-doc-ids.mjs",
  "cargo test --workspace --features cheaper-runtime/dev-seam,cheaper-cli/dev-seam",
  "node --test scripts/test/",
  "node --test benchmarks/test/",
  "node scripts/check-lockfile.mjs",
  "node scripts/check-apm-payload.mjs",
]
