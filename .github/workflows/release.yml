name: release

# 手動実行のみ。自動 trigger は設けない（PLAN-034z2bk7AEzZ66Mt0uXCyJ）。
# payload binary の再生成は build-executables workflow を手動 dispatch
# して行う（docs/guides/release.md の手順参照）。
on:
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag (vX.Y.Z) — packages/cli/package.json の version と一致必須"
        required: true
        type: string

permissions:
  contents: write

env:
  GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
  GH_REPO: ${{ github.repository }}

jobs:
  build-executables:
    uses: ./.github/workflows/build-executables.yml
    with:
      ref: ${{ inputs.tag }}
      strict_freshness: true

  # Release 作成・upload は単一 job に集約する。matrix job がそれぞれ
  # `gh release create` を試みると初回実行で duplicate create race が
  # 起き、また一部 platform だけ先に公開される partial release に
  # なり得るため。
  publish-release:
    needs: build-executables
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag }}

      # tag が packages/cli/package.json の version と一致しなければ fail。
      # version 宣言 drift のある artifact を release しないためのゲート。
      - name: Verify tag matches package version
        shell: bash
        run: |
          pkg_version="$(node -p "require('./packages/cli/package.json').version")"
          if [ "${{ inputs.tag }}" != "v${pkg_version}" ]; then
            echo "tag ${{ inputs.tag }} does not match package version ${pkg_version}" >&2
            exit 1
          fi

      - uses: actions/download-artifact@v4
        with:
          pattern: sea-*
          merge-multiple: true
          path: dist/sea

      - name: Create release and upload all artifacts
        shell: bash
        run: |
          set -euo pipefail
          ls -la dist/sea
          gh release create "${{ inputs.tag }}" dist/sea/* \
            --generate-notes
