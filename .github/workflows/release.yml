name: release (retired)

on:
  workflow_dispatch:
    inputs:
      tag:
        description: "旧経路は廃止。release-acquisition を使用してください"
        required: true
        type: string

permissions:
  contents: read

jobs:
  refuse-legacy-release:
    runs-on: ubuntu-latest
    steps:
      - name: Refuse legacy publication
        run: |
          echo "This release workflow is retired. Dispatch release-acquisition with an immutable version tag." >&2
          exit 1
