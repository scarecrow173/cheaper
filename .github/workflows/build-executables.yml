name: build-executables

# 4 target の Rust release binary を cargo matrix で build して artifact
# として取得する reusable workflow。release-acquisition は固定 SHA と
# expected_version を渡す。手動 dispatch は任意 ref の native artifact を
# 検証用に生成する。binary は Release/local build に置き、Git source へ
# 追加しない。darwin-arm64 は検証専用で、Release asset・manifest には
# 含めない(asset 名・SHA256SUMS・launcher contract は不変)。
on:
  workflow_dispatch:
    inputs:
      ref:
        description: "Build 対象の ref（branch/tag/SHA）"
        required: true
        type: string
  workflow_call:
    inputs:
      ref:
        required: true
        type: string
      expected_version:
        description: "呼出元が固定したversion（不在なら従来経路を維持）"
        required: false
        type: string

jobs:
  build-executable:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            target: win32-x64
            cargo_target: x86_64-pc-windows-msvc
            artifact: cheaper-windows-x64.exe
          - os: ubuntu-latest
            target: linux-x64
            cargo_target: x86_64-unknown-linux-musl
            artifact: cheaper-linux-x64
          - os: ubuntu-24.04-arm
            target: linux-arm64
            cargo_target: aarch64-unknown-linux-musl
            artifact: cheaper-linux-arm64
          - os: macos-latest
            target: darwin-arm64
            cargo_target: aarch64-apple-darwin
            artifact: cheaper-darwin-arm64
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref }}

      - uses: jdx/mise-action@v4
        with:
          minimum_release_age: 7d
          install_args: "--locked"

      - name: Verify expected release version before build
        if: ${{ inputs.expected_version != '' }}
        shell: bash
        env:
          EXPECTED_VERSION: ${{ inputs.expected_version }}
        run: |
          node --input-type=module -e 'import {cargoWorkspaceVersion} from "./scripts/lib/release-artifacts.mjs"; if (cargoWorkspaceVersion(process.cwd()) !== process.env.EXPECTED_VERSION) throw new Error("expected release version mismatch");'

      # rustup toolchain は mise(core:rust)が管理する。RUSTUP_TOOLCHAIN を
      # 伝えるため mise exec 経由で target を追加する。
      - name: Add Rust target
        run: mise exec -- rustup target add ${{ matrix.cargo_target }}

      # aws-lc-sys / ring(rustls 経由の C 依存)が musl target の C toolchain
      # を必要とするため musl-tools(musl-gcc + musl-dev)を入れる。
      - name: Install musl C toolchain
        if: ${{ contains(matrix.cargo_target, 'musl') }}
        run: |
          sudo apt-get update
          sudo apt-get install -y musl-tools

      - name: Build release binary
        run: mise exec -- cargo build --release --locked --target ${{ matrix.cargo_target }} -p cheaper-cli

      - name: Stage release binary under dist/bin
        shell: bash
        run: |
          set -euo pipefail
          bin="target/${{ matrix.cargo_target }}/release/cheaper"
          [ -f "${bin}" ] || bin="${bin}.exe"
          mkdir -p dist/bin
          cp "${bin}" "dist/bin/${{ matrix.artifact }}"

      # build 後・upload 前の gate。20MiB 超過は job を fail させる。
      - name: Assert binary size budget
        run: node scripts/check-binary-size.mjs --file "dist/bin/${{ matrix.artifact }}"

      - name: Smoke test executable
        shell: bash
        run: |
          set -euo pipefail
          exe="dist/bin/${{ matrix.artifact }}"
          reported="$("${exe}" --version)"
          pkg_version="$(node --input-type=module -e 'import {cargoWorkspaceVersion} from "./scripts/lib/release-artifacts.mjs"; console.log(cargoWorkspaceVersion(process.cwd()))')"
          if [ "${reported}" != "${pkg_version}" ]; then
            echo "executable --version ${reported} does not match canonical version ${pkg_version}" >&2
            exit 1
          fi
          "${exe}" models > /dev/null

      - uses: actions/upload-artifact@v4
        with:
          name: bin-${{ matrix.target }}
          path: dist/bin/${{ matrix.artifact }}
