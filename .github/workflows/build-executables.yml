name: build-executables

# 3 target の SEA executable を build して artifact として取得する
# reusable workflow。release-acquisition は固定 SHA と expected_version を渡す。
# 手動 dispatch は任意 ref の native artifact を検証用に生成する。
# binary は Release/local build に置き、Git source へ追加しない。
on:
  workflow_dispatch:
    inputs:
      ref:
        description: "Build 対象の ref（branch/tag/SHA）"
        required: true
        type: string
  workflow_call:
    inputs:
      ref:
        required: true
        type: string
      expected_version:
        description: "呼出元が固定したversion（不在なら従来経路を維持）"
        required: false
        type: string

jobs:
  build-executable:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            target: win32-x64
            artifact: cheaper-windows-x64.exe
          - os: ubuntu-latest
            target: linux-x64
            artifact: cheaper-linux-x64
          - os: ubuntu-24.04-arm
            target: linux-arm64
            artifact: cheaper-linux-arm64
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref }}

      - uses: jdx/mise-action@v4
        with:
          minimum_release_age: 7d
          install_args: "--locked"

      - name: Verify expected release version before build
        if: ${{ inputs.expected_version != '' }}
        shell: bash
        env:
          EXPECTED_VERSION: ${{ inputs.expected_version }}
        run: |
          node -e 'if (require("./packages/cli/package.json").version !== process.env.EXPECTED_VERSION) throw new Error("expected release version mismatch");'

      - run: pnpm install --frozen-lockfile
      - run: pnpm build

      - run: node scripts/build-executable.mjs --target ${{ matrix.target }}

      - name: Smoke test executable
        shell: bash
        run: |
          exe="dist/sea/${{ matrix.artifact }}"
          reported="$("${exe}" --version)"
          pkg_version="$(node -p "require('./packages/cli/package.json').version")"
          if [ "${reported}" != "${pkg_version}" ]; then
            echo "executable --version ${reported} does not match package version ${pkg_version}" >&2
            exit 1
          fi
          "${exe}" models > /dev/null

      - uses: actions/upload-artifact@v4
        with:
          name: sea-${{ matrix.target }}
          path: dist/sea/${{ matrix.artifact }}
