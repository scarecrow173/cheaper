name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: jdx/mise-action@v4
        with:
          # リポジトリの mise.toml minimum_release_age と同じ方針
          minimum_release_age: 7d

      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test

      - name: bundle freshness
        # 生成物 packages/apm/.apm/hooks/cli が source と同期しているか検査する
        run: |
          node scripts/bundle-cli.mjs
          git diff --exit-code -- packages/apm/.apm/hooks/cli
