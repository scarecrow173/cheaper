name: ci

# 手動実行のみ。ubuntu 上の mise run check は時間がかかるため
# push/PR では自動起動せず、必要時に Actions から dispatch する。
on:
  workflow_dispatch:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: jdx/mise-action@v4
        with:
          # リポジトリの mise.toml minimum_release_age と同じ方針
          minimum_release_age: 7d
          # mise.lock に基づく locked install を明示
          install_args: "--locked"

      # repository-owned contract と同じ entrypoint を利用する
      - run: mise run setup
      - run: mise run check
