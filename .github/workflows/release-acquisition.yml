name: release-acquisition

# acquisition 互換 Release を固定 SHA から 1 dispatch で組み立てる唯一の公開経路。
on:
  workflow_dispatch:
    inputs:
      tag:
        description: "既存tag v<version>（canonical versionと一致必須）"
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: release-acquisition-${{ inputs.tag }}
  cancel-in-progress: false

jobs:
  resolve-release:
    runs-on: ubuntu-latest
    outputs:
      sha: ${{ steps.resolve.outputs.sha }}
      version: ${{ steps.resolve.outputs.version }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag }}
      - uses: jdx/mise-action@v4
        with:
          minimum_release_age: 7d
          install_args: "--locked"
      - name: Verify release declarations and focused contracts
        id: resolve
        shell: bash
        env:
          TAG: ${{ inputs.tag }}
        run: |
          set -euo pipefail
          version="$(node --input-type=module -e 'import {verifyReleaseVersion} from "./scripts/lib/release-artifacts.mjs"; console.log(verifyReleaseVersion(process.cwd(), process.env.TAG));')"
          node --test scripts/test/binary-size.test.mjs scripts/test/release-artifacts.test.mjs scripts/test/release-workflow.test.mjs
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

  build-executables:
    needs: resolve-release
    uses: ./.github/workflows/build-executables.yml
    with:
      ref: ${{ needs.resolve-release.outputs.sha }}
      expected_version: ${{ needs.resolve-release.outputs.version }}

  assemble-release:
    needs: [resolve-release, build-executables]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.resolve-release.outputs.sha }}
      - uses: jdx/mise-action@v4
        with:
          minimum_release_age: 7d
          install_args: "--locked"
      - uses: actions/download-artifact@v4
        with:
          pattern: bin-*
          merge-multiple: true
          path: dist/bin
      - name: Generate manifest and staged APM archive
        shell: bash
        env:
          TAG: ${{ inputs.tag }}
        run: |
          set -euo pipefail
          node scripts/generate-release-checksums.mjs --asset-dir dist/bin --tag "$TAG"
          node scripts/assemble-release-bundle.mjs --asset-dir dist/bin --out-dir dist/release --tag "$TAG"
      - uses: actions/upload-artifact@v4
        with:
          name: release-bundle
          path: |
            dist/release/SHA256SUMS
            dist/release/cheaper-apm-*.tar.gz
          if-no-files-found: error

  smoke-bundle:
    needs: [resolve-release, assemble-release]
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest, ubuntu-24.04-arm, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.resolve-release.outputs.sha }}
      - uses: jdx/mise-action@v4
        with:
          minimum_release_age: 7d
          install_args: "--locked"
      - uses: actions/download-artifact@v4
        with:
          name: release-bundle
          path: dist/release
      - name: Extract staged APM package
        shell: bash
        env:
          VERSION: ${{ needs.resolve-release.outputs.version }}
        run: |
          set -euo pipefail
          mkdir -p dist/extracted
          tar -xzf "dist/release/cheaper-apm-v$VERSION.tar.gz" -C dist/extracted
      # darwin-arm64 は Release asset に含めない検証 target。bundle には
      # sibling が無いため、build artifact を sibling として配置し、
      # launcher の sibling 優先経路だけを検証する(acquisition は試みない)。
      - uses: actions/download-artifact@v4
        if: ${{ matrix.os == 'macos-latest' }}
        with:
          name: bin-darwin-arm64
          path: dist/bin
      - name: Place darwin sibling executable
        if: ${{ matrix.os == 'macos-latest' }}
        shell: bash
        run: |
          set -euo pipefail
          dir="dist/extracted/cheaper/.apm/hooks/cli/bin/darwin-arm64"
          mkdir -p "$dir"
          cp dist/bin/cheaper-darwin-arm64 "$dir/cheaper"
          chmod 0755 "$dir/cheaper"
      - name: APM install and Node-free native launcher smoke
        shell: bash
        env:
          VERSION: ${{ needs.resolve-release.outputs.version }}
        run: |
          set -euo pipefail
          node scripts/smoke-release.mjs --package-dir dist/extracted/cheaper --manifest dist/release/SHA256SUMS --version "$VERSION"

  publish-release:
    needs: [resolve-release, build-executables, assemble-release, smoke-bundle]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.resolve-release.outputs.sha }}
      - uses: jdx/mise-action@v4
        with:
          minimum_release_age: 7d
          install_args: "--locked"
      - uses: actions/download-artifact@v4
        with:
          pattern: bin-*
          merge-multiple: true
          path: dist/bin
      - uses: actions/download-artifact@v4
        with:
          name: release-bundle
          path: dist/release
      - name: Revalidate tag and upload draft before publication
        shell: bash
        env:
          TAG: ${{ inputs.tag }}
          VERSION: ${{ needs.resolve-release.outputs.version }}
          RESOLVED_SHA: ${{ needs.resolve-release.outputs.sha }}
          GH_REPO: ${{ github.repository }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          git fetch --no-tags origin "refs/tags/$TAG"
          test "$(git rev-parse 'FETCH_HEAD^{commit}')" = "$RESOLVED_SHA"
          cp dist/release/SHA256SUMS dist/bin/SHA256SUMS
          node scripts/generate-release-checksums.mjs --asset-dir dist/bin --tag "$TAG" --verify
          # API失敗をabsenceとみなさない。既存draft/publicをexact tagで拒否する。
          gh api --paginate --slurp "repos/$GH_REPO/releases" > "$RUNNER_TEMP/releases.json"
          RELEASE_LIST="$RUNNER_TEMP/releases.json" node --input-type=module -e 'import {readFileSync} from "node:fs"; const pages = JSON.parse(readFileSync(process.env.RELEASE_LIST)); if (!Array.isArray(pages) || pages.some(p => !Array.isArray(p))) throw new Error("invalid release-list response"); if (pages.flat().some(r => r.tag_name === process.env.TAG)) throw new Error("release already exists; inspect draft/public state manually");'
          gh release create "$TAG" \
            dist/bin/cheaper-linux-x64 dist/bin/cheaper-linux-arm64 dist/bin/cheaper-windows-x64.exe \
            dist/release/SHA256SUMS "dist/release/cheaper-apm-v$VERSION.tar.gz" \
            --draft --verify-tag --latest=false --generate-notes
          gh release edit "$TAG" --draft=false --latest=false
